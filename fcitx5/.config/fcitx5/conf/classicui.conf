[ClassicUI]
# 候选词窗口在 Wayland 下使用 layer-shell
# 确保候选词窗口正确显示
VerticalCandidateList=False
# 显示输入法信息
ShowInputMethodInformation=True
ShowInputMethodInformationWhenFocusIn=False
ShowInputMethodInformationDuration=500
# 字体设置（适配 HiDPI）
Font="JetBrainsMono Nerd Font 12"
# 菜单字体
MenuFont="JetBrainsMono Nerd Font 12"
# 跟随光标
FollowCursor=True
# 主题
Theme=default
# 坚排候选词列表宽度
CandidateLayoutHint=Not Set
# 使用 Wayland 输入法协议
UseInputMethodV2=True
